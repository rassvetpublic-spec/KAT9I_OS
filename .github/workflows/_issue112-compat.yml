name: Issue 112 compatibility patch

on:
  push:
    branches:
      - feat/issue-112-project-queue
    paths:
      - .github/workflows/_issue112-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-112-project-queue
      - name: Сохранить regression-контракт ошибки
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/configure_project.ps1')
          text = path.read_text(encoding='utf-8')
          old = "требует небезопасной миграции существующих option ID:"
          new = "требует изменения option ID: небезопасная миграция существующих значений:"
          if text.count(old) != 1:
              raise SystemExit(f'legacy error anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          Path('.github/workflows/_issue112-compat.yml').unlink()
      - name: Зафиксировать patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/configure_project.ps1 .github/workflows/_issue112-compat.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix(project): preserve fail-closed error contract"
          git push origin HEAD:feat/issue-112-project-queue
