name: Issue 112 — временная регенерация HTML

on:
  push:
    branches:
      - feat/issue-112-project-queue

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Получить ветку
        uses: actions/checkout@v4
        with:
          ref: feat/issue-112-project-queue
      - name: Пересобрать производный HTML
        run: python scripts/generate_html_docs.py
      - name: Зафиксировать только index.html
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "index.html уже актуален"
            exit 0
          fi
          test -z "$(git status --porcelain --untracked-files=no | grep -v ' index.html$' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "docs: regenerate HTML for project queue"
          git push origin HEAD:feat/issue-112-project-queue
