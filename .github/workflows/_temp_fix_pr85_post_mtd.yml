name: TEMP PR85 post-MTD fixes

on:
  push:
    branches:
      - docs/p0-cache-engine-architecture

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0-cache-engine-architecture
          fetch-depth: 0
      - name: Apply review fixes and regenerate docs
        shell: bash
        run: |
          python scripts/_temp_fix_pr85_post_mtd.py
          python scripts/generate_html_docs.py
          rm scripts/_temp_fix_pr85_post_mtd.py
          rm .github/workflows/_temp_fix_pr85_post_mtd.yml
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "rassvetpublic"
          git config user.email "rassvetpublic@gmail.com"
          git add -A
          git commit -m "fix: закрыть review-блокеры CacheEngine PR #85"
          git push origin HEAD:docs/p0-cache-engine-architecture
