name: TEMP PR85 regenerate index

on:
  push:
    branches:
      - docs/p0-cache-engine-architecture

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0-cache-engine-architecture
          fetch-depth: 0
      - name: Regenerate derived index
        run: python scripts/generate_html_docs.py
      - name: Commit generated index and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/_temp_generate_index_pr85.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: синхронизировать index.html для CacheEngine (#84)"
          git push origin HEAD:docs/p0-cache-engine-architecture
