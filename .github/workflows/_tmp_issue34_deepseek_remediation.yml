name: TEMP issue34 DeepSeek remediation

on:
  push:
    branches:
      - docs/issue-34-deepseek-qa-remediation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-34-deepseek-qa-remediation
      - name: Apply narrow registry remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- **OQ-004** — реализация и гарантии изоляции локальных Workers (Windows Job Objects / cgroups) (Issue #49).': '- **OQ-004** — минимальный безопасный внутренний API между Electron и Core (Issue #41).',
              'Все остальные открытые вопросы (OQ-011, OQ-012, OQ-013, OQ-017 и далее) сознательно классифицированы как `DEFERRED` (отложены до v0.2, v1.0 или post-release) и не блокируют допуск к реализации v0.1.': 'Остальные вопросы не входят в список `OPEN BEFORE v0.1` выше и откладываются строго по своим детальным статусам: OQ-011 — `DEFERRED UNTIL PRE-RELEASE`, OQ-012 и OQ-013 — `DEFERRED UNTIL v0.2`; будущие OQ получают собственный явный этап. Они не должны считаться закрытыми или переноситься на другой срок только из-за этой сводки.',
              'Реализовано единое производное представление с 5 уровнями подробности (1. Очень просто / 2. Просто / 3. Рабочий / 4. Технический / 5. Максимум) на базе двухуровневой разметки атрибутов `data-section-level` и `data-detail-level` без дублирования текста спецификаций. Навигация и фильтрация доказаны автоматическими тестами `tests/test_docs_ssot.py`.': 'Реализовано единое производное представление с 5 уровнями подробности (1. Очень просто / 2. Просто / 3. Рабочий / 4. Технический / 5. Максимум) на базе двухуровневой разметки атрибутов `data-section-level` и `data-detail-level` без дублирования текста спецификаций. Автоматические тесты `tests/test_docs_ssot.py` подтверждают структурное наличие разметки и связанной JavaScript-логики; они не являются browser/DOM-level доказательством фактического поведения навигации и фильтрации.'
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, got {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/generate_html_docs.py
      - name: Commit regenerated files
        shell: bash
        run: |
          if git diff --quiet -- docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md index.html; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md index.html
          git commit -m 'docs: remediate registry findings from external QA'
          git push origin HEAD:docs/issue-34-deepseek-qa-remediation
