name: TEMP issue34 regenerate docs v2

on:
  push:
    branches:
      - docs/issue-34-remove-duplicate-oq-refs-v2

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-34-remove-duplicate-oq-refs-v2
      - name: Apply narrow QA remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '(Issue #40, #57).': '(Issue #40).',
              '(Issue #49, #58).': '(Issue #49).',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, got {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/generate_html_docs.py
      - name: Commit regenerated files to remediation branch
        shell: bash
        run: |
          if git diff --quiet -- docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md index.html; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md index.html
          git commit -m 'docs: remove duplicate issue refs from OQ registry'
          git push origin HEAD:docs/issue-34-remove-duplicate-oq-refs-v2
