name: Runtime Antigravity ONE

on:
  pull_request:
    paths:
      - 'bootstrap/antigravity-one/**'
      - 'scripts/antigravity_one_contract.py'
      - 'tests/test_antigravity_one_contract.py'
      - 'tests/test_antigravity_one_host_smoke_contract.py'
      - '.github/workflows/antigravity-one-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Проверка runtime-контракта Antigravity ONE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Проверить manifest и сигнатуры
        run: python scripts/antigravity_one_contract.py --check
      - name: Запустить regression-тесты Antigravity ONE
        run: python -m unittest tests/test_antigravity_one_contract.py tests/test_antigravity_one_host_smoke_contract.py
      - name: Проверить наличие единой точки входа и runtime-файлов
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/antigravity-one/ANTIGRAVITY.cmd
          test -f bootstrap/antigravity-one/Install-Antigravity-One.ps1
          test -f bootstrap/antigravity-one/Test-Antigravity-One-Host.ps1
          test -f bootstrap/antigravity-one/_System/Antigravity-Control.ps1
          test -f bootstrap/antigravity-one/_System/Patch-Antigravity.ps1
          test -f bootstrap/antigravity-one/_System/patch-signatures.json

  windows-parse:
    name: Проверка PowerShell на Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Проверить синтаксис PowerShell runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bootstrap/antigravity-one/Install-Antigravity-One.ps1',
            'bootstrap/antigravity-one/Test-Antigravity-One-Host.ps1',
            'bootstrap/antigravity-one/_System/Antigravity-Control.ps1',
            'bootstrap/antigravity-one/_System/Patch-Antigravity.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
            Write-Host "OK: $file"
          }
      - name: Zero-state smoke — bootstrap и DryRun должны fail-closed без mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'antigravity-zero-state'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }

          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'bootstrap/antigravity-one/Install-Antigravity-One.ps1' -Root $root
          $installRc = [int]$LASTEXITCODE
          if ($installRc -eq 0) { throw 'Zero-state install unexpectedly reported success without a language_server target.' }

          foreach ($required in @(
            (Join-Path $root 'ANTIGRAVITY.cmd'),
            (Join-Path $root '_System\Antigravity-Control.ps1'),
            (Join-Path $root '_System\Patch-Antigravity.ps1'),
            (Join-Path $root '_System\patch-signatures.json')
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Bootstrap file missing: $required" }
          }

          foreach ($forbidden in @(
            (Join-Path $root 'Standalone\Profile'),
            (Join-Path $root '_Manager\Data'),
            (Join-Path $root '_Manager\State'),
            (Join-Path $root '_System\patch-state.json')
          )) {
            if (Test-Path -LiteralPath $forbidden) { throw "Zero-state bootstrap mutated protected state: $forbidden" }
          }

          $receiptsBefore = @(Get-ChildItem -LiteralPath (Join-Path $root '_System\Receipts') -Filter 'patch_*.json' -File -ErrorAction SilentlyContinue).Count
          $entry = Join-Path $root 'ANTIGRAVITY.cmd'
          $commandLine = '""{0}" dryrun"' -f $entry
          & $env:ComSpec /d /c $commandLine
          $dryRunRc = [int]$LASTEXITCODE
          if ($dryRunRc -eq 0) { throw 'DryRun unexpectedly reported compatibility success without a language_server target.' }

          foreach ($forbidden in @(
            (Join-Path $root 'Standalone\Profile'),
            (Join-Path $root '_Manager\Data'),
            (Join-Path $root '_Manager\State'),
            (Join-Path $root '_System\patch-state.json')
          )) {
            if (Test-Path -LiteralPath $forbidden) { throw "DryRun mutated protected state: $forbidden" }
          }

          $receiptsAfter = @(Get-ChildItem -LiteralPath (Join-Path $root '_System\Receipts') -Filter 'patch_*.json' -File -ErrorAction SilentlyContinue).Count
          if ($receiptsAfter -le $receiptsBefore) { throw 'DryRun did not produce read-only diagnostic receipt.' }
          Write-Host "ZERO_STATE_SMOKE_PASS install_rc=$installRc dryrun_rc=$dryRunRc receipts=$receiptsAfter"
          exit 0
