name: Temporary Issue 118 HTML regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/generate_html_docs.py'
      - '.github/workflows/issue118-regenerate-html.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/issue-118-restore-section2-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Generate HTML
        run: python scripts/generate_html_docs.py
      - name: Commit generated index when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'index.html already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'docs: regenerate HTML for issue 118'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
