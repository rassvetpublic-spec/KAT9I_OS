name: Issue 122 apply OQ-010 docs

on:
  push:
    branches:
      - docs/issue-122-close-oq010-ui-core-lifecycle

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply accepted OQ-010 decision
        run: python .github/issue122_apply.py

      - name: Regenerate derived HTML
        run: python scripts/generate_html_docs.py

      - name: Commit generated documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/22_CONFIGURATION_STARTUP_AND_UPDATES.md docs/architecture/23_TECHNOLOGY_STACK_AND_RUNTIME.md docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "docs: close OQ-010 UI/Core lifecycle (#122)"
          git push
