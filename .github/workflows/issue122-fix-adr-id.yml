name: Issue 122 fix ADR id

on:
  push:
    branches:
      - docs/issue-122-close-oq010-ui-core-lifecycle

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace conflicting ADR id and regenerate HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md')
          s = p.read_text(encoding='utf-8')
          old1 = '## 32.62. OQ-010 / ADR-046 — жизненный цикл Electron UI и Core'
          new1 = '## 32.62. OQ-010 / ADR-047 — жизненный цикл Electron UI и Core'
          old2 = '> **Статус:** `ACCEPTED` (ADR-046; канонические источники: [§22](22_CONFIGURATION_STARTUP_AND_UPDATES.md), [§23](23_TECHNOLOGY_STACK_AND_RUNTIME.md), Issue #122).'
          new2 = '> **Статус:** `ACCEPTED` (ADR-047; канонические источники: [§22](22_CONFIGURATION_STARTUP_AND_UPDATES.md), [§23](23_TECHNOLOGY_STACK_AND_RUNTIME.md), Issue #122).'
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit('Expected OQ-010 ADR-046 markers not found exactly once')
          p.write_text(s.replace(old1, new1, 1).replace(old2, new2, 1), encoding='utf-8')
          PY
          python scripts/generate_html_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md index.html
          git commit -m "fix: assign OQ-010 unique ADR-047 (#122)"
          git push
