name: Issue 122 regenerate HTML

on:
  push:
    branches:
      - docs/issue-122-close-oq010-ui-core-lifecycle

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate HTML
        run: |
          python scripts/generate_html_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "docs: regenerate HTML after main integration (#122)"
          git push
