name: Issue 126 normalize conflict state

on:
  push:
    branches:
      - docs/issue-126-tz-requirements-abc-xyz-plan

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize status terminology and regenerate docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/spec/25_TZ_REQUIREMENTS_PRIORITIZATION_PIPELINE.md')
          s = p.read_text(encoding='utf-8')
          old = 'Если во время inventory обнаружена неопределённость, она становится `GAP`, `CONFLICT` или отдельным OQ/Issue.'
          new = 'Если во время inventory обнаружена неопределённость, она фиксируется как `GAP` в Requirement status, как `CONTRADICTION` в Coverage/Contradiction status либо как отдельный OQ/Issue.'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one T0 conflict sentence, got {s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = '**Coverage/Contradiction Report** — список GAP/CONFLICT и их владельцев.'
          new2 = '**Coverage/Contradiction Report** — список GAP/CONTRADICTION и их владельцев.'
          if s.count(old2) != 1:
              raise SystemExit(f'Expected one report conflict sentence, got {s.count(old2)}')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/generate_html_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spec/25_TZ_REQUIREMENTS_PRIORITIZATION_PIPELINE.md index.html
          git commit -m "docs: normalize T0 conflict terminology (#126)"
          git push