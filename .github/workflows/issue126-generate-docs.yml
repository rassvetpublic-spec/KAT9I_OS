name: Issue 126 generate docs

on:
  push:
    branches:
      - docs/issue-126-tz-requirements-abc-xyz-plan

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate documentation
        shell: bash
        run: |
          python scripts/generate_html_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: regenerate HTML for T0-T5 plan (#126)"
          git push
