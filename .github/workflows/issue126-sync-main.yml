name: Issue 126 sync main

on:
  push:
    branches:
      - docs/issue-126-tz-requirements-abc-xyz-plan

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current main and regenerate docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python scripts/generate_html_docs.py
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "docs: regenerate HTML after main sync (#126)"; fi
          git push
