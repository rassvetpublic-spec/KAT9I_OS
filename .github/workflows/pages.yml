name: Публикация HTML ТЗ

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Подготовить сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
