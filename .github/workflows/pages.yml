name: Проверка и публикация HTML ТЗ

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Проверить HTML ТЗ
        shell: bash
        run: |
          test -s index.html
          test -d docs

      - name: Проверить состояние GitHub Pages
        id: pages_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/pages.json" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages пока не включён для репозитория. Сайт проверен и будет сохранён как артефакт; после включения Pages этот же workflow начнёт публикацию автоматически."
          fi

      - name: Сохранить готовый сайт как артефакт
        if: steps.pages_state.outputs.enabled != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kat9i-os-html-tz
          path: |
            index.html
            docs
          if-no-files-found: error
          retention-days: 14

      - name: Настроить GitHub Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Подготовить сайт для GitHub Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Опубликовать сайт
        if: steps.pages_state.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
