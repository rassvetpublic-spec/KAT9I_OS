name: Project — синхронизация очереди

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, closed, synchronize]
  workflow_dispatch:
    inputs:
      url:
        description: URL Issue или PR для восстановительной синхронизации
        required: true
        type: string
      state:
        description: Состояние очереди
        required: true
        type: choice
        options: [INBOX, READY, ACTIVE, WAITING_FOR_REQUIRED_CHECK, QA, QUEUED, BLOCKED, DONE]

permissions:
  contents: read
  issues: read
  pull-requests: read

# Сериализуем переходы только одной и той же карточки. Глобальная группа
# заменяла pending run другой карточки при burst-событиях и теряла lifecycle updates.
concurrency:
  group: kat9i-project-queue-${{ github.event.issue.number || github.event.pull_request.number || inputs.url || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KAT9I_PROJECT_TOKEN }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Определить доверенное событие очереди
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ACTOR: ${{ github.actor }}
          DISPATCH_URL: ${{ inputs.url }}
          DISPATCH_STATE: ${{ inputs.state }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$EVENT_ACTOR" != "rassvetpublic-spec" ]; then
              echo "::error::Восстановительную синхронизацию Project может запускать только владелец."
              exit 1
            fi
            printf 'url=%s\n' "$DISPATCH_URL" >> "$GITHUB_OUTPUT"
            printf 'state=%s\n' "$DISPATCH_STATE" >> "$GITHUB_OUTPUT"
            printf 'worker=\n' >> "$GITHUB_OUTPUT"
            printf 'qa=\n' >> "$GITHUB_OUTPUT"
            printf 'expected_head=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/project_queue_event.py --event-name "$EVENT_NAME" --action "$EVENT_ACTION" --event-path "$GITHUB_EVENT_PATH" --output queue-event.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('queue-event.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"url={data.get('url','')}\n")
              out.write(f"state={data.get('state','')}\n")
              out.write(f"worker={data.get('worker','')}\n")
              out.write(f"qa={data.get('qa','')}\n")
              out.write(f"expected_head={data.get('expected_head','')}\n")
          PY

      - name: Нет управляющего перехода
        if: steps.resolve.outputs.state == ''
        run: echo "Событие не содержит доверенного перехода Project queue; изменений нет."

      - name: Проверить exact HEAD перед QUEUED
        if: steps.resolve.outputs.state == 'QUEUED'
        shell: bash
        env:
          ITEM_URL: ${{ steps.resolve.outputs.url }}
          EXPECTED_HEAD: ${{ steps.resolve.outputs.expected_head }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_HEAD" ]; then
            echo "::error::FAST-QA-PASS не содержит exact HEAD; QUEUED запрещён."
            exit 1
          fi
          LIVE_HEAD="$(gh pr view "$ITEM_URL" --json headRefOid --jq '.headRefOid')"
          if [ "$LIVE_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::STALE_QA: live PR HEAD=$LIVE_HEAD, QA HEAD=$EXPECTED_HEAD; QUEUED запрещён."
            exit 1
          fi

      - name: Диагностический preflight Project credential
        if: steps.resolve.outputs.state != ''
        shell: pwsh
        env:
          ITEM_URL: ${{ steps.resolve.outputs.url }}
          ITEM_STATE: ${{ steps.resolve.outputs.state }}
          ITEM_WORKER: ${{ steps.resolve.outputs.worker }}
          ITEM_QA: ${{ steps.resolve.outputs.qa }}
        run: ./scripts/project_credential_preflight.ps1 -Url "$env:ITEM_URL" -State "$env:ITEM_STATE" -Worker "$env:ITEM_WORKER" -QaWorker "$env:ITEM_QA"

      - name: Синхронизировать lifecycle карточки
        if: steps.resolve.outputs.state != ''
        shell: pwsh
        env:
          ITEM_URL: ${{ steps.resolve.outputs.url }}
          ITEM_STATE: ${{ steps.resolve.outputs.state }}
          ITEM_WORKER: ${{ steps.resolve.outputs.worker }}
          ITEM_QA: ${{ steps.resolve.outputs.qa }}
        run: ./scripts/project_queue_sync.ps1 -Url "$env:ITEM_URL" -State "$env:ITEM_STATE" -Worker "$env:ITEM_WORKER" -QaWorker "$env:ITEM_QA"
