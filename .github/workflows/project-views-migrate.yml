name: Project — миграция восьми представлений

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Полный проверенный SHA main для применения
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: g0-project-remediation
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.repository == 'rassvetpublic-spec/KAT9I_OS' &&
      github.actor == 'rassvetpublic-spec' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.number == 150 &&
        startsWith(github.event.comment.body, 'KAT9I-CONTROL/1 | PROJECT-VIEWS-APPLY')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить точную revision main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Проверить управляющую команду
        run: python scripts/project_view_authorization.py

      - name: Проверить актуальность main перед доступом к Project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_head="$(gh api repos/rassvetpublic-spec/KAT9I_OS/git/ref/heads/main --jq .object.sha)"
          test "$live_head" = "$GITHUB_SHA"

      - name: Сохранить снимок до миграции
        id: snapshot
        env:
          GH_TOKEN: ${{ secrets.KAT9I_PROJECT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.g0_control_plane_audit import collect_live
          data = collect_live('rassvetpublic-spec', 'KAT9I_OS', 2)
          Path('project-before.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Повторно проверить актуальность main перед изменениями Project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_head="$(gh api repos/rassvetpublic-spec/KAT9I_OS/git/ref/heads/main --jq .object.sha)"
          test "$live_head" = "$GITHUB_SHA"

      - name: Применить согласованную схему представлений
        id: apply
        env:
          GH_TOKEN: ${{ secrets.KAT9I_PROJECT_TOKEN }}
        run: python scripts/project_views_reconcile.py

      - name: Проверить полный control-plane после bounded repair
        id: audit
        if: always() && steps.snapshot.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.KAT9I_PROJECT_TOKEN }}
        run: python scripts/g0_control_plane_audit.py --output project-after-audit.json

      - name: Разложить post-audit findings по доменам
        if: always() && steps.snapshot.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -s project-after-audit.json ]; then
            python scripts/project_audit_domains.py project-after-audit.json
          fi

      - name: Построить раздельный repair/global-audit Evidence
        if: always() && steps.snapshot.outcome == 'success'
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: >-
          python scripts/project_repair_evidence.py
          --target-domain views
          --apply-outcome "$APPLY_OUTCOME"
          --before project-before.json
          --after-audit project-after-audit.json
          --output project-repair-summary.json

      - name: Сохранить Evidence миграции
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: project-views-evidence-${{ github.run_id }}
          path: |
            project-before.json
            project-after-audit.json
            project-repair-summary.json
          if-no-files-found: error

      - name: Показать bounded repair отдельно от глобального аудита
        if: always() && steps.snapshot.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path('project-repair-summary.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f"### Bounded repair Views: {summary['repair_verdict']}\n")
              out.write(f"Target views: {summary['target_before']} → {summary['target_after']}.\n\n")
              out.write(f"### Full G0 post-audit: {summary['global_audit_verdict']}\n")
              out.write(f"Findings: {summary['global_finding_count']}; domains: {summary['after_domain_counts']}.\n\n")
              out.write(f"Unrelated regressions: {summary['unrelated_regressions']}.\n\n")
              out.write('Repair Evidence не является QA PASS, merge authority или завершением всей #150.\n')
          PY

      - name: Fail-closed только по bounded repair/regression contract
        if: always() && steps.snapshot.outcome == 'success'
        run: python scripts/project_repair_evidence.py --check-summary project-repair-summary.json
