name: Контроль качества репозитория

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Базовые проверки качества и целостности
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Получить base revision PR для append-only Graveyard
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Получить предыдущую revision main для append-only Graveyard
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}"

      - name: Проверить обязательную структуру репозитория
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -d docs
          test -f docs/spec/00_LANGUAGE_AND_TERMINOLOGY_POLICY.md
          test -f docs/spec/24_GITHUB_PROJECT_MANAGEMENT.md
          test -f docs/guides/GITHUB_FOR_COWORKERS.md
          test -f docs/guides/GITHUB_KAT9I_MAPPING.md
          test -f docs/guides/FIRST_TIME_GUIDE.md
          test -f docs/architecture/27_MODULE_REGISTRY_AND_RESPONSIBILITY_MAP.md
          test -f docs/architecture/MODULE_RESPONSIBILITY_MAP.md
          test -f docs/GLOSSARY.md
          test -f scripts/generate_html_docs.py
          test -f scripts/check_graveyard.py
          test -f scripts/graveyard_context.py
          test -f tests/test_docs_ssot.py
          test -f tests/test_graveyard.py
          test -f tests/test_graveyard_context.py
          test -f graveyard/README.md
          test -f graveyard/MANIFEST.json
          test -f schemas/v1/ContextRef.json
          test -f schemas/v1/GraveyardCandidate.json
          test -f .github/ISSUE_TEMPLATE/feedback.yml
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/CODEOWNERS
          test -f index.html

      - name: Проверить UTF-8, обязательные документы и русские пояснения
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          required_russian = [
              Path('docs/spec/00_LANGUAGE_AND_TERMINOLOGY_POLICY.md'),
              Path('docs/spec/24_GITHUB_PROJECT_MANAGEMENT.md'),
              Path('docs/guides/GITHUB_FOR_COWORKERS.md'),
              Path('docs/guides/GITHUB_KAT9I_MAPPING.md'),
              Path('docs/guides/FIRST_TIME_GUIDE.md'),
              Path('docs/architecture/27_MODULE_REGISTRY_AND_RESPONSIBILITY_MAP.md'),
              Path('docs/architecture/MODULE_RESPONSIBILITY_MAP.md'),
              Path('docs/GLOSSARY.md'),
              Path('.github/PULL_REQUEST_TEMPLATE.md'),
              Path('.github/ISSUE_TEMPLATE/feedback.yml'),
          ]

          for path in required_russian:
              text = path.read_text(encoding='utf-8')
              if not text.strip():
                  raise SystemExit(f'Пустой обязательный файл: {path}')
              if not any(('А' <= c <= 'я') or c in 'Ёё' for c in text):
                  raise SystemExit(f'Нет русского текста: {path}')

          for path in Path('docs').rglob('*.md'):
              path.read_text(encoding='utf-8')

          for path in list(Path('docs/spec').glob('*.md')) + list(Path('docs/guides').glob('*.md')):
              text = path.read_text(encoding='utf-8')
              for line_no, line in enumerate(text.splitlines(), start=1):
                  if re.search(r'(?<![A-Za-z0-9_])KAT(?![A-Za-z0-9_9])', line):
                      if 'сокращение' in line.lower() or 'не используется' in line.lower():
                          continue
                      raise SystemExit(f'Обнаружено запрещённое сокращение KAT в {path}:{line_no}: {line}')

          print('Все проверки документации, кодировки и терминологии успешно пройдены.')
          PY

      - name: Проверить форму обратной связи и шаблоны
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^name: Обратная связь' .github/ISSUE_TEMPLATE/feedback.yml
          grep -q 'Что вы пытались сделать' .github/ISSUE_TEMPLATE/feedback.yml
          grep -q 'не добавил.*секрет' .github/ISSUE_TEMPLATE/feedback.yml
          grep -q 'Revision для проверки:' .github/PULL_REQUEST_TEMPLATE.md
          grep -q 'Независимый QA' .github/PULL_REQUEST_TEMPLATE.md
          grep -q 'Трассировка критериев готовности' .github/PULL_REQUEST_TEMPLATE.md

      - name: Проверить синтаксис всех YAML файлов
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path

          yaml_files = list(Path('.github').rglob('*.yml')) + list(Path('.github').rglob('*.yaml'))
          for yf in yaml_files:
              with open(yf, 'r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f"OK: {yf}")
          print(f"Успешно проверено {len(yaml_files)} YAML-файлов.")
          PY

      - name: Запустить контрактные и Graveyard тесты
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_docs_ssot.py
          python -m unittest tests/test_triage_helper.py
          python -m unittest tests/test_contract_schemas.py
          python scripts/verify_module_registry.py
          python -m unittest tests/test_graveyard.py
          python -m unittest tests/test_graveyard_context.py

      - name: Проверить Graveyard как DATA-only append-only слой
        shell: bash
        env:
          GRAVEYARD_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          python scripts/check_graveyard.py

      - name: Проверить генератор HTML и синхронизацию единого источника истины (SSOT)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_html_docs.py
          test -s index.html
          grep -q 'Официальная каноническая документация' index.html
          grep -q 'Режим «Я здесь впервые»' index.html

          if ! git diff --exit-code index.html; then
            echo "::error::Ошибка SSoT: Закоммиченный файл index.html устарел относительно канонических Markdown-документов!"
            echo "Пожалуйста, выполните команду 'python scripts/generate_html_docs.py' локально и закоммитьте обновленный index.html."
            exit 1
          fi
          echo 'Генератор HTML и проверка синхронизации SSOT успешно пройдены: index.html полностью синхронизирован.'
