name: Required check — диагностический observer

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Контроль качества репозитория"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Номер PR для ручной диагностики
        required: true
        type: number

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  audit:
    name: Диагностика required-check drift
    runs-on: ubuntu-latest
    steps:
      - name: Получить доверенный код observer
        uses: actions/checkout@v4

      - name: Определить PR и наблюдавшийся HEAD
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          event_name = os.environ['EVENT_NAME']
          pr_number = ''
          observed_head = ''
          if event_name == 'pull_request':
              pr = event.get('pull_request') or {}
              pr_number = str(pr.get('number') or '')
              observed_head = str(((pr.get('head') or {}).get('sha') or ''))
          elif event_name == 'workflow_run':
              run = event.get('workflow_run') or {}
              prs = run.get('pull_requests') or []
              if len(prs) == 1:
                  pr_number = str((prs[0] or {}).get('number') or '')
              observed_head = str(run.get('head_sha') or '')
          elif event_name == 'workflow_dispatch':
              pr_number = str(os.environ.get('DISPATCH_PR') or '')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"pr_number={pr_number}\n")
              out.write(f"observed_head={observed_head}\n")
              out.write(f"skip={'false' if pr_number else 'true'}\n")
          PY

      - name: Нет однозначного PR
        if: steps.target.outputs.skip == 'true'
        run: echo "Workflow run не связан ровно с одним PR; diagnostic-only observer не делает предположений."

      - name: Собрать required-check Evidence
        if: steps.target.outputs.skip == 'false'
        id: collect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          OBSERVED_HEAD: ${{ steps.target.outputs.observed_head }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
          LIVE_HEAD="$(python - <<'PY'
          import json
          print(json.load(open('current-pr.json', encoding='utf-8'))['head']['sha'])
          PY
          )"
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/commits/$LIVE_HEAD/check-runs?per_page=100" > current-checks.json
          if [ -n "$OBSERVED_HEAD" ] && [ "$OBSERVED_HEAD" != "$LIVE_HEAD" ]; then
            gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/commits/$OBSERVED_HEAD/check-runs?per_page=100" > observed-checks.json
          else
            printf '{"check_runs":[]}\n' > observed-checks.json
          fi
          python - <<'PY'
          import json
          current=json.load(open('current-checks.json', encoding='utf-8'))
          observed=json.load(open('observed-checks.json', encoding='utf-8'))
          receipts=list(current.get('check_runs') or []) + list(observed.get('check_runs') or [])
          json.dump({'receipts': receipts}, open('required-check-receipts.json','w',encoding='utf-8'), ensure_ascii=False)
          PY
          python scripts/required_check_state.py --current-head "$LIVE_HEAD" --input required-check-receipts.json --output required-check-state.json
          echo "live_head=$LIVE_HEAD" >> "$GITHUB_OUTPUT"

      - name: Опубликовать diagnostic Evidence в summary
        if: steps.target.outputs.skip == 'false'
        shell: bash
        run: |
          {
            echo '## Required-check drift'
            echo
            echo '```json'
            cat required-check-state.json
            echo '```'
            echo
            echo 'Observer имеет только DIAGNOSTIC_ONLY authority и не меняет Project/QA/merge state.'
          } >> "$GITHUB_STEP_SUMMARY"
