name: T0 Graveyard SSoT corrective worker
on:
  push:
    branches:
      - docs/issue-129-t0-requirements-registry
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-129-t0-requirements-registry
          fetch-depth: 0
      - name: Fix Graveyard canonical source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('requirements_registry.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          req = next(r for r in data['requirements'] if r['requirement_id'] == 'REQ-GRAVEYARD-001')
          req['canonical_ssot'] = 'schemas/README.md#5'
          refs = [x for x in req.get('supporting_refs', []) if x != 'schemas/README.md#5']
          if 'graveyard/README.md' not in refs:
              refs.append('graveyard/README.md')
          req['supporting_refs'] = refs
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          report = Path('docs/reports/T0_REQUIREMENTS_REGISTRY.md')
          text = report.read_text(encoding='utf-8')
          marker = '- полнота canonical source→Requirement linkage проверяется тестом.\n'
          addition = '- Graveyard DATA-only: `schemas/README.md#5` является canonical SSoT, а `graveyard/README.md` оставлен только supporting provenance.\n'
          if addition not in text:
              text = text.replace(marker, marker + addition)
          report.write_text(text, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_requirements_registry.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/t0-graveyard-fix.yml
          git add requirements_registry.json docs/reports/T0_REQUIREMENTS_REGISTRY.md
          git commit -m 'fix(T0): keep Graveyard outside canonical SSoT'
          git push origin HEAD:docs/issue-129-t0-requirements-registry
