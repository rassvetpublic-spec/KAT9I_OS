name: T0 registry corrective worker
on:
  push:
    branches:
      - docs/issue-129-t0-requirements-registry
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-129-t0-requirements-registry
          fetch-depth: 0
      - name: Apply corrective pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          echo '' | base64 -d > /tmp/t0_fix.py
          python /tmp/t0_fix.py
          git rm .github/workflows/t0-registry-corrective.yml
          python -m unittest tests.test_requirements_registry
          git add requirements_registry.json schemas/v1/RequirementsRegistry.json tests/test_requirements_registry.py docs/reports/T0_REQUIREMENTS_REGISTRY.md schemas/README.md
          git commit -m "fix(T0): close registry traceability review findings"
          git push origin HEAD:docs/issue-129-t0-requirements-registry
