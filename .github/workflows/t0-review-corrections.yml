name: T0 — bounded review corrections

on:
  push:
    branches:
      - docs/issue-129-t0-requirements-registry
    paths:
      - .github/workflows/t0-review-corrections.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Получить exact branch
        uses: actions/checkout@v4
        with:
          ref: docs/issue-129-t0-requirements-registry
          fetch-depth: 0
      - name: Применить bounded T0 corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'requirements_registry.json'
          data = json.loads(registry_path.read_text(encoding='utf-8'))

          sources = data['source_inventory']
          by_path = {s['path']: s for s in sources}
          by_path['schemas/README.md']['role'] = 'CANONICAL_SSoT'
          by_path['schemas/README.md']['notes'] = 'Каноническая политика каталога схем и Graveyard contract boundary.'
          if 'QA_PROTOCOL.md' not in by_path:
              insert_at = next((i + 1 for i, s in enumerate(sources) if s['path'] == 'docs/GITHUB_WORKFLOW.md'), len(sources))
              sources.insert(insert_at, {
                  'path': 'QA_PROTOCOL.md',
                  'role': 'CANONICAL_SSoT',
                  'notes': 'Канонический операционный протокол Controller ↔ QA Executor.'
              })

          reqs = data['requirements']
          by_id = {r['requirement_id']: r for r in reqs}

          contract = by_id['REQ-CONTRACTS-001']
          contract['machine_contract_refs'] = sorted(
              p.as_posix() for p in (root / 'schemas' / 'v1').glob('*.json') if p.is_file()
          )

          oq = by_id['REQ-OQ010-001']
          oq['canonical_ssot'] = 'docs/architecture/22_CONFIGURATION_STARTUP_AND_UPDATES.md'
          oq['supporting_refs'] = [
              'docs/architecture/23_TECHNOLOGY_STACK_AND_RUNTIME.md',
              'docs/architecture/32_ARCHITECTURAL_DECISIONS_AND_OPEN_QUESTIONS.md#OQ-010'
          ]
          oq['coverage_notes'] = 'OQ-010 закрыт и принят как ADR-047 после PR #123; профильный lifecycle SSoT — §22, §23 и ADR-047 сохранены как supporting provenance.'

          lang = by_id['REQ-LANGUAGE-001']
          lang['canonical_owner'] = 'UNRESOLVED'
          lang['coverage_status'] = 'OWNER_GAP'
          lang['coverage_notes'] = 'Языковая политика канонична, но отдельный владелец этой политики в SSoT не назначен; T0 не создаёт owner самостоятельно.'

          qa_protocol_id = 'REQ-QA-PROTOCOL-001'
          if qa_protocol_id not in by_id:
              qa_req = {
                  'requirement_id': qa_protocol_id,
                  'title': 'Controller и QA Executor обмениваются через аудируемый QA-COMMAND → QA-RESULT → QA-ACCEPT протокол',
                  'area': 'QA / Control plane',
                  'type': 'PROCESS',
                  'canonical_ssot': 'QA_PROTOCOL.md',
                  'canonical_owner': 'Project governance',
                  'target_gate': 'G0+',
                  'target_version': 'continuous',
                  'status': 'ACCEPTED',
                  'dependencies': ['REQ-QA-001', 'REQ-GITHUB-001'],
                  'machine_contract_refs': [],
                  'evidence_refs': ['.github/workflows/qa-result-bridge.yml', '.github/workflows/project-queue-sync.yml'],
                  'issue_refs': ['#124', '#130'],
                  'coverage_status': 'COVERED',
                  'abc': 'UNASSESSED',
                  'xyz': 'UNASSESSED',
                  'materialization': 'MATERIALIZED',
                  'supporting_refs': ['docs/spec/23_TESTING_QA_AND_READINESS.md', 'docs/spec/24_GITHUB_PROJECT_MANAGEMENT.md']
              }
              idx = next(i + 1 for i, r in enumerate(reqs) if r['requirement_id'] == 'REQ-QA-001')
              reqs.insert(idx, qa_req)

          gaps = data['gaps']
          if not any('REQ-LANGUAGE-001' in g.get('requirement_refs', []) and g.get('kind') == 'OWNER_GAP' for g in gaps):
              nums = [int(g['gap_id'].rsplit('-', 1)[1]) for g in gaps]
              gaps.append({
                  'gap_id': f'GAP-T0-{max(nums) + 1:03d}',
                  'kind': 'OWNER_GAP',
                  'title': 'Не назначен канонический владелец языковой политики',
                  'requirement_refs': ['REQ-LANGUAGE-001'],
                  'source_refs': ['docs/spec/00_LANGUAGE_AND_TERMINOLOGY_POLICY.md'],
                  'status': 'OPEN',
                  'notes': 'T0 фиксирует отсутствие owner как gap и не вводит новую ownership-сущность без канонического решения.'
              })

          registry_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = root / 'tests' / 'test_requirements_registry.py'
          test = test_path.read_text(encoding='utf-8')
          needle = '            "docs/GITHUB_WORKFLOW.md",\n'
          if '            "QA_PROTOCOL.md",\n' not in test:
              test = test.replace(needle, needle + '            "QA_PROTOCOL.md",\n', 1)
          marker = '    def test_each_requirement_has_one_canonical_owner(self):\n'
          method = '''    def test_machine_contract_refs_are_literal_resolvable_repo_files(self):\n        for item in self.registry["requirements"]:\n            for ref in item["machine_contract_refs"]:\n                self.assertNotIn("*", ref, f"{item['requirement_id']}: wildcard contract ref: {ref}")\n                path = REPO_ROOT / self._repo_path(ref)\n                self.assertTrue(path.is_file(), f"{item['requirement_id']}: machine_contract_ref не разрешяется: {ref}")\n\n'''
          if 'test_machine_contract_refs_are_literal_resolvable_repo_files' not in test:
              test = test.replace(marker, method + marker, 1)
          owner_marker = '    def test_noncovered_requirement_has_gap_of_same_kind(self):\n'
          owner_method = '''    def test_owner_gap_does_not_invent_canonical_owner(self):\n        for item in self.registry["requirements"]:\n            if item["coverage_status"] == "OWNER_GAP":\n                self.assertEqual(item["canonical_owner"], "UNRESOLVED")\n\n'''
          if 'test_owner_gap_does_not_invent_canonical_owner' not in test:
              test = test.replace(owner_marker, owner_method + owner_marker, 1)
          test_path.write_text(test, encoding='utf-8')

          report_path = root / 'docs' / 'reports' / 'T0_REQUIREMENTS_REGISTRY.md'
          report = report_path.read_text(encoding='utf-8')
          report = report.replace('- Requirements: **50**.', '- Requirements: **51**.')
          report = report.replace('- Findings/gaps: **18**.', '- Findings/gaps: **19**.')
          if '- `OWNER_GAP`: 1' not in report:
              report = report.replace('- `TRACEABILITY_GAP`: 1\n', '- `TRACEABILITY_GAP`: 1\n- `OWNER_GAP`: 1\n', 1)
          if '- `OWNER_GAP`: 1' in report and report.count('- `OWNER_GAP`: 1') == 1:
              second_anchor = '## Зарегистрированные findings\n\n'
              report = report.replace(second_anchor, second_anchor + '- `OWNER_GAP`: 1\n', 1)
          correction_anchor = '## Исправления после review\n\n'
          additions = ('- `QA_PROTOCOL.md` включён в canonical inventory и связан с отдельным Requirement control-plane QA-протокола;\n'
                       '- `machine_contract_refs` теперь содержат только literal разрешимые schema refs, wildcard запрещён regression-тестом;\n'
                       '- OQ-010 использует профильный §22 как canonical SSoT, §23/ADR-047 остаются supporting provenance;\n'
                       '- языковая политика фиксирует `OWNER_GAP` вместо создания несуществующего canonical owner;\n')
          if '`QA_PROTOCOL.md` включён в canonical inventory' not in report:
              report = report.replace(correction_anchor, correction_anchor + additions, 1)
          report_path.write_text(report, encoding='utf-8')
          PY
          rm -f .github/workflows/t0-review-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements_registry.json tests/test_requirements_registry.py docs/reports/T0_REQUIREMENTS_REGISTRY.md .github/workflows/t0-review-corrections.yml
          git diff --cached --check
          git commit -m 'fix(T0): resolve final traceability review findings'
          git push origin HEAD:docs/issue-129-t0-requirements-registry
