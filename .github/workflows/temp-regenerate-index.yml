name: TEMP — regenerate index.html

on:
  push:
    branches:
      - docs/registry-priority-evidence-system
    paths:
      - .github/workflows/temp-regenerate-index.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/registry-priority-evidence-system
          fetch-depth: 0

      - name: Regenerate index.html
        run: python scripts/generate_html_docs.py

      - name: Commit generated index only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "index.html already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "docs: regenerate index.html"
          git push origin HEAD:docs/registry-priority-evidence-system
