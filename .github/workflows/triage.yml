name: triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    name: triage
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Классифицировать обращение
        id: classify
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.triage_helper import classify_issue_text, format_triage_comment

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue = event.get("issue")
          if not issue:
              raise SystemExit("В событии GitHub нет Issue.")

          repository = event.get("repository") or {}
          owner = ((repository.get("owner") or {}).get("login")) or ""
          repo = repository.get("name") or ""
          if not owner or not repo:
              raise SystemExit("Не удалось определить owner/repo из события GitHub.")

          result = classify_issue_text(issue.get("title") or "", issue.get("body") or "")
          payload = {
              "labels": result["labels"],
              "comment": format_triage_comment(result, owner, repo),
          }

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write("result=" + json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n")
          PY

      - name: Добавить метки и комментарий
        uses: actions/github-script@v7
        env:
          TRIAGE_RESULT: ${{ steps.classify.outputs.result }}
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const result = JSON.parse(process.env.TRIAGE_RESULT || '{}');
            const labels = Array.isArray(result.labels) ? result.labels : [];
            const comment = typeof result.comment === 'string' ? result.comment : '';

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels
              });
            }

            if (!comment) {
              throw new Error('Классификатор не вернул комментарий triage.');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });
